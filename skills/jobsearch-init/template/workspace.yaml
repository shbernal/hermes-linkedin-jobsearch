schema_version: 2


# ── Autonomy ────────────────────────────────────────────────────────────────
# Which outside actions the agent takes without your go. Anything not allowed here waits for you.
#
# Sending an application:
#   off         the agent prepares it, you send it
#   approval    the agent sends once you name the entry
#   unattended  Advance sends on its own

linkedin_easy_apply: approval   # off | approval | unattended
external_forms: off             # off | approval | unattended, on the systems atsfill's submit-allowed names

hide_known_jobs_from_linkedin_search: false   # true: dismiss_ids hides them for good
archive_handled_emails: false                 # true: Tracking archives application emails it has handled

# A failure in the LinkedIn tools, atsfill or this profile, recorded in issues/ without your data:
#   off         recorded, with a link you can file it from
#   approval    the agent asks, then files it
#   unattended  the agent files it right away, so upstream fixes it sooner

file_github_issues: off   # off | approval | unattended, the last two through gh


# ── Limits ──────────────────────────────────────────────────────────────────
# How much of what autonomy allows, attended or not.

max_applications_sent_per_day: 2         # Easy Apply and external forms together
max_linkedin_close_outs_per_day: 5       # unsave, archive job, archive conversation
max_search_pages_per_discovery_run: 20   # LinkedIn search result pages
max_tracks: 3


# ── Timings ─────────────────────────────────────────────────────────────────

weeks_without_answer_until_ghosted: 8               # an applied entry with no answer this long becomes ghosted
days_before_reapplying_to_unanswered_employer: 30   # until then, an employer that hasn't answered gets no other application


# ── Reports ─────────────────────────────────────────────────────────────────

report_delivery_target: local   # --deliver target of every scheduled run (telegram, discord, ...), set by init
